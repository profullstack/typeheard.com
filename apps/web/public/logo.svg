<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 256" role="img" aria-label="typeheard">
  <style>
    .type { fill: #17150f; }
    .heard { fill: #e4572e; }
    @media (prefers-color-scheme: dark) {
      .type { fill: #f3f1ea; }
      .heard { fill: #ff7a50; }
    }
    text { font: 800 172px/1 Inter, "SF Pro Display", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -8px; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a5a"/>
      <stop offset=".55" stop-color="#e4572e"/>
      <stop offset="1" stop-color="#b3261e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="scale(.5)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect width="512" height="512" rx="116" fill="url(#shine)"/>
    <g transform="translate(256 256) scale(1.12) translate(-256 -256)">
    <g fill="#fff">
      <rect x="72" y="206" width="34" height="100" rx="17"/>
      <rect x="124" y="132" width="34" height="248" rx="17"/>
      <rect x="176" y="176" width="34" height="160" rx="17"/>
      <rect x="248" y="150" width="192" height="40" rx="20"/>
      <rect x="248" y="236" width="140" height="40" rx="20"/>
      <rect x="248" y="322" width="96" height="40" rx="20"/>
    </g>
    <rect x="364" y="304" width="22" height="76" rx="8" fill="#ffe27a">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    </g>
  </g>
  <text x="300" y="186" textLength="840" lengthAdjust="spacingAndGlyphs"><tspan class="type">type</tspan><tspan class="heard">heard</tspan></text>
</svg>
